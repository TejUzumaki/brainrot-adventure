<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c0e">
<title>BRAIN ROT — Combat Protocol</title>
<style>
:root{--ui-bg:rgba(8,11,14,.5);--ui-border:rgba(255,255,255,.14);--font:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;--mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;--accent:#67e8f9;--danger:#ff4e50;--muted:#8fa3ad;}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--font);}
#game-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;}
#ui-layer{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden;}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.45) 100%);}
.hud-top-left{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:7px;}
.stat{display:flex;align-items:center;gap:8px;}
.stat-label{font-size:.62rem;font-weight:700;letter-spacing:.25em;color:var(--muted);width:30px;text-shadow:0 1px 4px rgba(0,0,0,.7);}
.bar-container{width:200px;height:14px;background:var(--ui-bg);border:1px solid var(--ui-border);transform:skewX(-14deg);overflow:hidden;backdrop-filter:blur(4px);}
.bar-fill{height:100%;width:100%;transition:width .12s linear;}
#health-fill{background:linear-gradient(90deg,#8f1024,#ff4e50);}
#energy-fill{background:linear-gradient(90deg,#0072ff,#00e5ff);}
.hud-top-right{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:stretch;z-index:30;}
.stat-box{background:var(--ui-bg);border:1px solid var(--ui-border);border-radius:10px;padding:5px 14px 7px;text-align:right;backdrop-filter:blur(4px);min-width:78px;}
.hud-label{display:block;font-size:.58rem;letter-spacing:.3em;color:var(--muted);}
.stat-value{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:#fff;line-height:1.1;display:inline-block;}
#score-value.pop{animation:pop .3s ease-out;}
@keyframes pop{30%{transform:scale(1.4);color:var(--accent);}}
#btn-fullscreen{width:42px;border-radius:10px;background:var(--ui-bg);border:1px solid var(--ui-border);color:#cfe3ec;display:flex;align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px);z-index:30;}
#btn-fullscreen svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;}
#ammo-panel{position:absolute;right:calc(26px + env(safe-area-inset-right,0px));bottom:calc(158px + env(safe-area-inset-bottom,0px));text-align:right;pointer-events:auto;z-index:30;}
#ammo-count{font-family:var(--mono);font-size:2.1rem;font-weight:700;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7);}
#ammo-max{font-family:var(--mono);font-size:.95rem;color:var(--muted);margin-left:4px;}
#ammo-panel.low #ammo-count{color:var(--danger);}
#reload-hint{display:none;font-size:.65rem;letter-spacing:.35em;color:var(--accent);margin-top:2px;}
#ammo-panel.reloading #reload-hint{display:block;animation:blink .45s infinite alternate;}
@keyframes blink{from{opacity:.35;}to{opacity:1;}}
#crosshair{position:absolute;top:50%;left:50%;width:32px;height:32px;transform:translate(-50%,-50%);opacity:.85;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8));}
#hitmarker{position:absolute;top:50%;left:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:0;}
#hitmarker span{position:absolute;width:3px;height:10px;background:#fff;top:50%;left:50%;box-shadow:0 0 4px rgba(0,0,0,.8);}
#hitmarker span:nth-child(1){transform:translate(-16px,-16px) rotate(-45deg);}
#hitmarker span:nth-child(2){transform:translate(13px,-16px) rotate(45deg);}
#hitmarker span:nth-child(3){transform:translate(-16px,7px) rotate(45deg);}
#hitmarker span:nth-child(4){transform:translate(13px,7px) rotate(-45deg);}
#hitmarker.show{animation:hm .2s ease-out;}
#hitmarker.kill span{background:#ff3b30;}
@keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3);}100%{opacity:0;transform:translate(-50%,-50%) scale(.9);}}
#level-banner{position:absolute;top:16%;width:100%;text-align:center;opacity:0;}
#level-banner.show{animation:banner 3s ease forwards;}
@keyframes banner{0%{opacity:0;transform:translateY(12px) scale(.97);}12%{opacity:1;transform:none;}80%{opacity:1;}100%{opacity:0;}}
#level-banner-title{font-size:2.3rem;font-weight:800;letter-spacing:.35em;color:#fff;text-shadow:0 2px 22px rgba(0,0,0,.7);}
#level-banner-sub{font-size:.8rem;letter-spacing:.5em;color:#a9bec9;margin-top:6px;}
/* floating damage numbers */
#dmg-layer{position:absolute;inset:0;pointer-events:none;z-index:20;}
.dmg-num{position:absolute;font-family:var(--mono);font-weight:800;font-size:1.15rem;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85);transform:translate(-50%,-50%);white-space:nowrap;display:none;}
.dmg-num.head{color:#ff5a4e;font-size:1.55rem;}
.dmg-num.limb{color:#c9d4da;font-size:.95rem;}
.dmg-num.kill{color:#ffd76b;font-size:1.5rem;letter-spacing:.12em;}
/* dummy health bar */
#dummy-hp{position:absolute;width:70px;transform:translate(-50%,-100%);pointer-events:none;display:none;z-index:20;}
#dummy-hp .hp-name{font-size:.55rem;letter-spacing:.25em;color:#e6eef2;text-align:center;margin-bottom:3px;text-shadow:0 1px 3px rgba(0,0,0,.8);}
#dummy-hp .hp-bg{height:6px;background:rgba(8,11,14,.6);border:1px solid rgba(255,255,255,.3);}
#dummy-hp .hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#8f1024,#ff4e50);transition:width .1s linear;}
#touch-left{position:absolute;top:0;left:0;width:50%;height:100%;pointer-events:auto;z-index:5;}
#touch-right{position:absolute;top:0;left:50%;width:50%;height:100%;pointer-events:auto;z-index:5;}
#joystick-base{position:absolute;width:124px;height:124px;background:rgba(10,14,18,.35);border:2px solid rgba(255,255,255,.22);border-radius:50%;display:none;pointer-events:none;backdrop-filter:blur(3px);z-index:6;}
#joystick-stick{position:absolute;top:50%;left:50%;width:52px;height:52px;background:rgba(230,240,245,.5);border:1px solid rgba(255,255,255,.5);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.4);}
.action-btns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:flex-end;pointer-events:auto;z-index:30;}
.btn{width:64px;height:64px;border-radius:50%;background:rgba(8,11,14,.45);border:2px solid rgba(255,255,255,.2);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;color:#e6eef2;transition:transform .08s,background .08s;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.btn:active{background:rgba(255,255,255,.18);transform:scale(.92);}
.btn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.btn-small{width:48px;height:48px;}
.btn-small svg{width:22px;height:22px;}
.btn-primary{width:88px;height:88px;background:rgba(160,32,32,.35);border-color:rgba(255,110,90,.55);}
.btn-primary:active{background:rgba(200,50,40,.55);}
.btn-primary svg{width:42px;height:42px;}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:60;pointer-events:auto;background:radial-gradient(ellipse at center,rgba(6,9,12,.55),rgba(2,3,5,.9));transition:opacity .45s;}
.overlay.hide{opacity:0;pointer-events:none;}
.game-title{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:900;letter-spacing:.22em;color:#e8f1f5;text-shadow:0 0 28px rgba(0,0,0,.9),3px 3px 0 rgba(130,20,20,.55),-3px -3px 0 rgba(20,90,100,.4);}
.game-sub{font-size:.75rem;letter-spacing:.55em;color:#93aab6;margin-top:10px;}
.start-hint{margin-top:36px;font-size:.95rem;font-weight:700;letter-spacing:.45em;color:#fff;animation:blink .8s infinite alternate;}
.controls-hint{margin-top:16px;font-size:.62rem;letter-spacing:.25em;color:#7d939f;}
#portrait-warning{display:none;position:absolute;inset:0;background:#0c0f12;color:#dfe9ee;z-index:100;justify-content:center;align-items:center;text-align:center;font-size:1.05rem;font-weight:700;letter-spacing:.1em;line-height:2;flex-direction:column;pointer-events:auto;}
#portrait-warning svg{width:52px;height:52px;stroke:#67e8f9;fill:none;stroke-width:1.6;margin-bottom:12px;}
@media (orientation:portrait){#portrait-warning{display:flex;}}
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================
   MODULE 1 — RENDERER / SCENE / CAMERA
============================================================ */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9cbd6, 26, 70);
const camera = new THREE.PerspectiveCamera(74, window.innerWidth / window.innerHeight, 0.05, 600);
camera.rotation.order = 'YXZ';
scene.add(camera);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

/* ============================================================
   MODULE 2 — GAME STATE
============================================================ */
const MAG = 30;
const state = {
    started: false,
    totalDmg: 0, health: 100, energy: 100,
    ammo: MAG, reloading: false, reloadT: 0,
    projectiles: [], particles: []
};
let shakeAmp = 0, fireCd = 0, lastBobCycle = 0, crosshairSpread = 0;
const player = { height: 2.2, speed: 7, dashSpeed: 24, isDashing: false, dashTimer: 0, yaw: 0, pitch: 0, bobTime: 0, bobAmt: 0 };
let prevYaw = 0, prevPitch = 0;
const gameActive = () => state.started;

/* ============================================================
   MODULE 3 — DOM REFS + FULLSCREEN MANAGER + UI HELPERS
============================================================ */
const el = id => document.getElementById(id);
const healthFill = el('health-fill'), energyFill = el('energy-fill');
const scoreValue = el('score-value');
const ammoPanel = el('ammo-panel'), ammoCount = el('ammo-count');
const crosshairEl = el('crosshair');
const bannerEl = el('level-banner'), bannerTitle = el('level-banner-title'), bannerSub = el('level-banner-sub');
const hm = el('hitmarker');
const startOverlay = el('start-overlay');
const btnFS = el('btn-fullscreen');

const FS = {
    supported: !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen),
    pending: false, active: false
};
function fsChange() { FS.active = !!(document.fullscreenElement || document.webkitFullscreenElement); FS.pending = false; }
document.addEventListener('fullscreenchange', fsChange);
document.addEventListener('webkitfullscreenchange', fsChange);
document.addEventListener('fullscreenerror', () => { FS.pending = false; });
document.addEventListener('webkitfullscreenerror', () => { FS.pending = false; });
function requestFS() {
    if (!FS.supported || FS.active || FS.pending) return;
    FS.pending = true;
    const elm = document.documentElement;
    let p;
    try { p = elm.requestFullscreen ? elm.requestFullscreen() : elm.webkitRequestFullscreen(); }
    catch (err) { FS.pending = false; return; }
    Promise.resolve(p).then(() => {
        FS.pending = false;
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
    }).catch(() => { FS.pending = false; });
}
function toggleFS() {
    if (FS.active) {
        const p = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen();
        if (p && p.catch) p.catch(() => {});
    } else requestFS();
}
if (!FS.supported) btnFS.style.display = 'none';

function hitmark(kill) { hm.classList.remove('show', 'kill'); void hm.offsetWidth; hm.classList.add('show'); if (kill) hm.classList.add('kill'); }
function scorePop() { scoreValue.classList.remove('pop'); void scoreValue.offsetWidth; scoreValue.classList.add('pop'); }
function banner(title, sub) { bannerTitle.textContent = title; bannerSub.textContent = sub; bannerEl.classList.remove('show'); void bannerEl.offsetWidth; bannerEl.classList.add('show'); }
function updateUI() {
    healthFill.style.width = clamp(state.health, 0, 100) + '%';
    energyFill.style.width = clamp(state.energy, 0, 100) + '%';
    scoreValue.textContent = state.totalDmg;
    ammoCount.textContent = state.ammo;
    ammoPanel.classList.toggle('low', state.ammo <= 8);
    ammoPanel.classList.toggle('reloading', state.reloading);
}

/* ============================================================
   MODULE 4 — TERRAIN (fixed square world, no chunking)
============================================================ */
const TERRAIN = { SEED: 73421, HEIGHT_SCALE: 7.5, LARGE_SCALE: 0.035, MEDIUM_SCALE: 0.085, SMALL_SCALE: 0.18, BASE_HEIGHT: 4 };
const WORLD_HALF = 58;       // playable boundary (translucent cuboid)
const TERRAIN_HALF = 82;     // rendered terrain extent (buffer beyond wall)
const WORLD_ZONES = [];      // flatten zones (houses, dummy pad)
const WORLD_PATHS = [];      // dirt path segments
const HOUSES = [
    { x: -34, z: -30, hw: 4.5, hd: 3.5, doorC: -0.8, seed: 11 },
    { x: 33,  z: -32, hw: 4.0, hd: 3.2, doorC: 0.6,  seed: 22 },
    { x: -36, z: 26,  hw: 4.2, hd: 3.6, doorC: 0.2,  seed: 33 },
    { x: 35,  z: 28,  hw: 4.6, hd: 3.4, doorC: -0.5, seed: 44 },
    { x: 6,   z: 42,  hw: 4.0, hd: 3.2, doorC: 0,    seed: 55 },
    { x: -8,  z: -46, hw: 4.4, hd: 3.4, doorC: 0.4,  seed: 66 }
];
function hash2D(x, z, seed = TERRAIN.SEED) {
    let h = Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(seed, 1442695041);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function smoothStep(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z, seed = TERRAIN.SEED) {
    const x0 = Math.floor(x), z0 = Math.floor(z);
    const tx = smoothStep(x - x0), tz = smoothStep(z - z0);
    const n00 = hash2D(x0, z0, seed), n10 = hash2D(x0 + 1, z0, seed);
    const n01 = hash2D(x0, z0 + 1, seed), n11 = hash2D(x0 + 1, z0 + 1, seed);
    const a = n00 + (n10 - n00) * tx, b = n01 + (n11 - n01) * tx;
    return a + (b - a) * tz;
}
function fractalNoise(x, z) {
    let v = 0, amp = 1, freq = 1, tot = 0;
    for (let i = 0; i < 4; i++) { v += valueNoise(x * freq, z * freq, TERRAIN.SEED + i * 9176) * amp; tot += amp; amp *= 0.5; freq *= 2; }
    return v / tot;
}
function triangularSlope(x, z) {
    const cell = 7;
    let fx = ((x % cell) + cell) % cell, fz = ((z % cell) + cell) % cell;
    fx /= cell; fz /= cell;
    const waveA = Math.abs(((fx + fz) % 1) - 0.5) * 2;
    const waveB = Math.abs(((fx - fz) % 1) - 0.5) * 2;
    return waveA * 0.65 + waveB * 0.35;
}
function rockFormation(x, z) {
    return fractalNoise(x * TERRAIN.LARGE_SCALE, z * TERRAIN.LARGE_SCALE) * 0.68 +
           fractalNoise(x * TERRAIN.MEDIUM_SCALE, z * TERRAIN.MEDIUM_SCALE) * 0.27 +
           fractalNoise(x * TERRAIN.SMALL_SCALE, z * TERRAIN.SMALL_SCALE) * 0.05;
}
function rawHeight(x, z) {
    let t = rockFormation(x, z) + triangularSlope(x, z) * 0.08;
    let h = TERRAIN.BASE_HEIGHT + t * TERRAIN.HEIGHT_SCALE * 0.6;
    const mesa = fractalNoise(x * 0.013 + 500, z * 0.013 + 500);
    if (mesa > 0.60) {
        const e = smoothStep(clamp((mesa - 0.60) / 0.045, 0, 1));
        h += e * 5.0 * (0.7 + 0.3 * fractalNoise(x * 0.02 + 800, z * 0.02 + 800));
    }
    const mn = fractalNoise(x * 0.006 + 900, z * 0.006 + 900);
    if (mn > 0.68) h += smoothStep(clamp((mn - 0.68) / 0.16, 0, 1)) * 17;
    const vi = Math.max(0, 1 - Math.abs(fractalNoise(x * 0.08, z * 0.08) - 0.5) * 2);
    h = h * (1 - vi * 0.04) + (Math.round(h * 2) / 2) * vi * 0.04;
    return clamp(h, 1, 26);
}
const SPAWN_Y = rawHeight(0, 0);
function heightWith(zones, paths, x, z) {
    let h = rawHeight(x, z);
    const d0 = Math.hypot(x, z);
    if (d0 < 22) { const t = 1 - clamp((d0 - 11) / 11, 0, 1); h = h * (1 - t) + SPAWN_Y * t; }
    for (let i = 0; i < zones.length; i++) {
        const f = zones[i];
        const dx = Math.max(f.minX - x, 0, x - f.maxX);
        const dz = Math.max(f.minZ - z, 0, z - f.maxZ);
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < f.fall) { const t = 1 - d / f.fall; h = h * (1 - t) + f.y * t; }
    }
    for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        const vx = p.x2 - p.x1, vz = p.z2 - p.z1;
        const len2 = vx * vx + vz * vz;
        let t = 0;
        if (len2 > 1e-6) t = clamp(((x - p.x1) * vx + (z - p.z1) * vz) / len2, 0, 1);
        const d = Math.hypot(x - (p.x1 + vx * t), z - (p.z1 + vz * t));
        if (d < p.w + 1.6) {
            const py = p.y1 + (p.y2 - p.y1) * t;
            const k = (1 - clamp((d - p.w * 0.5) / (p.w + 1.1), 0, 1)) * 0.65;
            h = h * (1 - k) + py * k;
        }
    }
    return h;
}

function collideObstacles(p, radius) {

}

}

            continue;
        }
        d.el.style.left = ((_v1.x * 0.5 + 0.5) * window.innerWidth) + 'px';
        d.el.style.top = ((-_v1.y * 0.5 + 0.5) * window.innerHeight) + 'px';
        const k = d.t / d.life;
        d.el.style.opacity = k < 0.6 ? 1 : (1 - (k - 0.6) / 0.4);
    }
}
/* dummy HP bar */
const dummyHpEl = el('dummy-hp'), dummyHpFill = el('dummy-hp-fill');
function updateDummyHp() {
    if (!dummy.loaded || dummy.dead) { dummyHpEl.style.display = 'none'; return; }
    _v1.set(dummy.pos.x, dummy.pos.y + 2.15, dummy.pos.z).project(camera);
    if (_v1.z > 1) { dummyHpEl.style.display = 'none'; return; }
    dummyHpEl.style.display = 'none';
    dummyHpEl.style.left = ((_v1.x * 0.5 + 0.5) * window.innerWidth) + 'px';
    dummyHpEl.style.top = ((-_v1.y * 0.5 + 0.5) * window.innerHeight) + 'px';
    dummyHpFill.style.width = clamp(dummy.hp / dummy.maxHp * 100, 0, 100) + '%';
}

/* ============================================================
   MODULE 14 — COMBAT / PARTICLES
============================================================ */
const tracerGeo = new THREE.BoxGeometry(0.045, 0.045, 0.65);
const tracerMat = new THREE.MeshBasicMaterial({ color: 0xffd27a, toneMapped: false });
const particleGeo = new THREE.BoxGeometry(1, 1, 1);
const particleMats = new Map();
function pmat(color) { if (!particleMats.has(color)) particleMats.set(color, new THREE.MeshBasicMaterial({ color: color })); return particleMats.get(color); }
function burst(pos, color, n, spd, size, gravity) {
    if (state.particles.length > 160) return;
    for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(particleGeo, pmat(color));
        m.scale.setScalar(size * (0.5 + Math.random()));
        m.position.copy(pos);
        const vel = new THREE.Vector3((Math.random() - 0.5) * spd, Math.random() * spd * 0.8, (Math.random() - 0.5) * spd);
        scene.add(m);
        state.particles.push({ mesh: m, vel: vel, life: 0.4 + Math.random() * 0.5, g: gravity ? 22 : 0 });
    }
}
const _sA = new THREE.Vector3(), _sB = new THREE.Vector3(), _sC = new THREE.Vector3();
function segSphere(a, b, c, r) {
    _sA.subVectors(b, a);
    const l2 = _sA.lengthSq();
    let t = 0;
    if (l2 > 0) t = clamp(_sB.subVectors(c, a).dot(_sA) / l2, 0, 1);
    _sC.copy(a).addScaledVector(_sA, t);
    return _sC.distanceTo(c) <= r ? _sC.clone() : null;
}
function tryFire() {
    if (state.reloading || state.ammo <= 0) { if (state.ammo <= 0 && !state.reloading) startReload(); return; }
    if (fireCd > 0) return;
    fireCd = 0.11;
    state.ammo--;
    gunRecoil = 1;
    muzzleLight.intensity = 6;
    flashMesh.visible = true;
    flashMesh.rotation.z = Math.random() * Math.PI;
    crosshairSpread = Math.min(1.2, crosshairSpread + 0.45);
    addShake(0.06);
    sfxShoot();
    camera.updateMatrixWorld(true);
    const dir = camera.getWorldDirection(new THREE.Vector3());
    dir.x += (Math.random() - 0.5) * 0.018;
    dir.y += (Math.random() - 0.5) * 0.018;
    dir.z += (Math.random() - 0.5) * 0.018;
    dir.normalize();
    const t = new THREE.Mesh(tracerGeo, tracerMat);
    muzzle.getWorldPosition(t.position);
    t.quaternion.setFromUnitVectors(_v1.set(0, 0, -1), dir);
    scene.add(t);
    state.projectiles.push({ mesh: t, dir: dir, life: 1.5, speed: 95, prev: t.position.clone() });
    if (state.ammo === 0) startReload();
}
function startReload() {
    if (state.reloading || state.ammo === MAG || !gameActive()) return;
    state.reloading = true;
    state.reloadT = 1.6;
    sfxReload();
}
function triggerDash() {
    if (!gameActive() || player.isDashing || state.energy < 30) return;
    state.energy -= 30;
    player.isDashing = true;
    player.dashTimer = 0.22;
    sfxDash();
}
function addShake(a) { shakeAmp = Math.min(0.8, shakeAmp + a); }

/* ============================================================
   MODULE 15 — GAME FLOW
============================================================ */
function startGame() {
    if (state.started) return;
    initAudio(); resumeAudio(); requestFS();
    state.started = true;
    startOverlay.classList.add('hide');
    banner('LIVE FIRE', 'ELIMINATE THE TARGET');
}
function bindTap(elm, fn) {
    elm.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); fn(); }, { passive: false });
    elm.addEventListener('click', e => { e.preventDefault(); fn(); });
}
bindTap(startOverlay, startGame);
btnFS.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleFS(); }, { passive: false });

/* ============================================================
   MODULE 16 — MAIN UPDATE
============================================================ */
function update(dt) {
    if (state.energy < 100) state.energy = Math.min(100, state.energy + 14 * dt);
    if (state.reloading) {
        state.reloadT -= dt;
        if (state.reloadT <= 0) { state.reloading = false; state.ammo = MAG; }
    }
    fireCd = Math.max(0, fireCd - dt);
    camera.rotation.set(player.pitch, player.yaw, 0);
    // movement (joystick + keyboard), clamped inside boundary cuboid
    const kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
    const ky = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
    const mx = clamp(input.moveX + kx, -1, 1);
    const my = clamp(input.moveY + ky, -1, 1);
    const fwd = _v1.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const rgt = _v2.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    const move = _v3.set(0, 0, 0).addScaledVector(fwd, -my).addScaledVector(rgt, mx);
    const moveMag = Math.min(1, move.length());
    if (moveMag > 0.01) move.normalize();
    let currentSpeed = player.speed;
    if (player.isDashing) {
        currentSpeed = player.dashSpeed;
        player.dashTimer -= dt;
        if (player.dashTimer <= 0) player.isDashing = false;
    }
    const BOUND = WORLD_HALF - 0.8;
    camera.position.x = clamp(camera.position.x + move.x * currentSpeed * moveMag * dt, -BOUND, BOUND);
    camera.position.z = clamp(camera.position.z + move.z * currentSpeed * moveMag * dt, -BOUND, BOUND);
    collideObstacles(camera.position, 0.6);
    const groundY = getTerrainHeight(camera.position.x, camera.position.z);
    collideBoxes(camera.position, 0.6, groundY, 2.0);
    if (moveMag > 0.1) player.bobTime += dt * (player.isDashing ? 22 : 11);
    player.bobAmt += ((moveMag > 0.1 ? 1 : 0) - player.bobAmt) * Math.min(1, dt * 8);
    camera.position.y = groundY + player.height + Math.sin(player.bobTime) * 0.14 * player.bobAmt;
    const cycle = Math.floor(player.bobTime / Math.PI);
    if (cycle !== lastBobCycle && moveMag > 0.1) { lastBobCycle = cycle; sfxStep(); }
    shakeAmp = Math.max(0, shakeAmp - dt * 2.2);
    if (shakeAmp > 0.001) {
        camera.rotation.x += (Math.random() - 0.5) * shakeAmp * 0.06;
        camera.rotation.y += (Math.random() - 0.5) * shakeAmp * 0.04;
        camera.rotation.z += (Math.random() - 0.5) * shakeAmp * 0.05;
    }
    // gun animation
    const dYaw = player.yaw - prevYaw, dPitch = player.pitch - prevPitch;
    prevYaw = player.yaw; prevPitch = player.pitch;
    swayX += (clamp(-dYaw * 6, -0.6, 0.6) - swayX) * Math.min(1, dt * 10);
    swayY += (clamp(dPitch * 6, -0.6, 0.6) - swayY) * Math.min(1, dt * 10);
    gunRecoil = Math.max(0, gunRecoil - dt * 7);
    let reloadDip = 0;
    if (state.reloading) reloadDip = Math.sin(clamp(1 - state.reloadT / 1.6, 0, 1) * Math.PI) * 0.85;
    gun.position.x = 0.34 + Math.cos(player.bobTime * 0.5) * 0.012 * player.bobAmt + swayX * 0.03;
    gun.position.y = -0.3 + Math.sin(player.bobTime) * 0.014 * player.bobAmt + swayY * 0.02 - reloadDip * 0.18 + Math.sin(performance.now() * 0.002) * 0.004;
    gun.position.z = -0.55 + gunRecoil * 0.1;
    gun.rotation.x = gunRecoil * 0.14 + swayY * 0.6 - reloadDip * 0.9;
    gun.rotation.y = swayX * 0.8;
    gun.rotation.z = swayX * 0.4;
    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 42);
    flashMesh.visible = muzzleLight.intensity > 1.5;
    crosshairSpread = Math.max(crosshairSpread - dt * 4, moveMag > 0.1 ? 0.25 : 0);
    crosshairEl.style.transform = 'translate(-50%,-50%) scale(' + (1 + crosshairSpread * 0.45) + ')';
    if (input.shooting) tryFire();
    // projectiles (tracers) — terrain, walls/rocks, then dummy hit zones
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const p = state.projectiles[i];
        p.prev.copy(p.mesh.position);
        p.mesh.position.addScaledVector(p.dir, p.speed * dt);
        p.life -= dt;
        let done = p.life <= 0;
        if (!done && p.mesh.position.y < getTerrainHeight(p.mesh.position.x, p.mesh.position.z)) {
            burst(p.mesh.position, 0x9a8a62, 4, 2.5, 0.08, true);
            done = true;
        }
        if (!done) {
            const wh = solidHitPoint(p.prev, p.mesh.position);
            if (wh) { burst(wh, 0xb0a898, 4, 2.5, 0.07, true); done = true; }
        }
        if (!done && dummy.loaded && !dummy.dead) {
            const base = dummy.pos;
            _v2.set(base.x, base.y + dummy.zones.head.y, base.z);
            let hitP = segSphere(p.prev, p.mesh.position, _v2, dummy.zones.head.r);
            let zone = 'head';
            if (!hitP) {
                _v2.set(base.x, base.y + dummy.zones.torso.y, base.z);
                hitP = segSphere(p.prev, p.mesh.position, _v2, dummy.zones.torso.r);
                zone = 'torso';
            }
            if (!hitP) {
                _v2.set(base.x, base.y + dummy.zones.legs.y, base.z);
                hitP = segSphere(p.prev, p.mesh.position, _v2, dummy.zones.legs.r);
                zone = 'legs';
            }
            if (hitP) {
                const dmg = dummy.zones[zone].dmg;
                dummy.hp -= dmg;
                state.totalDmg += dmg;
                scorePop();
                burst(hitP, 0x8a0f0f, zone === 'head' ? 10 : 7, 4.5, 0.11, true);
                const sp = spatial(base);
                if (zone === 'head') sfxHeadshot(sp.vol, sp.pan); else sfxHitFlesh(sp.vol, sp.pan);
                spawnDmgNum(hitP, dmg, zone === 'head' ? 'head' : zone === 'legs' ? 'limb' : '');
                if (dummy.hp <= 0) {
                    dummy.dead = true;
                    dummy.fallT = 0;
                    dummy.respawnT = 2.5;
                    spawnDmgNum(_v3.set(base.x, base.y + 2.0, base.z), 'DOWN', 'kill');
                    hitmark(true);
                } else hitmark(false);
                done = true;
            }
        }
        if (done) { scene.remove(p.mesh); state.projectiles.splice(i, 1); }
    }
    // particles
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        if (p.g) p.vel.y -= p.g * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        if (p.g) {
            const gy = getTerrainHeight(p.mesh.position.x, p.mesh.position.z);
            if (p.mesh.position.y < gy + 0.03) { p.mesh.position.y = gy + 0.03; p.vel.set(0, 0, 0); p.g = 0; }
        }
        p.mesh.rotation.x += dt * 7;
        p.mesh.rotation.z += dt * 5;
        p.life -= dt;
        p.mesh.scale.multiplyScalar(0.96);
        if (p.life <= 0) { scene.remove(p.mesh); state.particles.splice(i, 1); }
    }
    // dummy + damage numbers + hp bar
    updateDummy(dt);
    updateDmgNums(dt);
    updateDummyHp();
    // environment follows player
    sky.position.copy(camera.position);
    sun.position.copy(camera.position).addScaledVector(sunDir, 380);
    sun.lookAt(camera.position);
    sunHalo.position.copy(camera.position).addScaledVector(sunDir, 378);
    sunHalo.lookAt(camera.position);
    dirLight.position.copy(camera.position).addScaledVector(sunDir, 90);
    dirLight.target.position.copy(camera.position);
    dirLight.target.updateMatrixWorld();
    for (const c of clouds) {
        c.position.x += dt * 1.2;
        if (c.position.x - camera.position.x > 300) c.position.x -= 600;
        if (camera.position.x - c.position.x > 300) c.position.x += 600;
        if (c.position.z - camera.position.z > 300) c.position.z -= 600;
        if (camera.position.z - c.position.z > 300) c.position.z += 600;
    }
    updateUI();
}

/* ============================================================
   MODULE 17 — BOOT & LOOP
============================================================ */
buildWorld();
dummy.pos.y = getTerrainHeight(dummy.pos.x, dummy.pos.z);
camera.position.set(0, getTerrainHeight(0, 0) + player.height, 0);
updateUI();
// load the soldier (Idle animation); mannequin fallback if it fails
new GLTFLoader().load(
    SOLDIER_URL,
    (gltf) => {
        gltf.scene.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        mountDummy(gltf.scene, gltf.animations);
    },
    undefined,
    () => spawnMannequin()
);
setTimeout(spawnMannequin, 12000); // safety net if the CDN stalls

let lastTime = performance.now();
function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    update(dt);
    renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
